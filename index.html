<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Cửa Hàng Công Nghệ Hiện Đại</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#1e40af',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- Logo -->
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                <i class="fa-solid fa-bolt text-2xl text-blue-600"></i>
                <span class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">TechStore</span>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md hidden md:block">
                <div class="relative">
                    <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Tìm kiếm sản phẩm..." class="w-full pl-10 pr-4 py-2 border rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-100 focus:bg-white transition">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-2.5 text-gray-400 text-sm"></i>
                </div>
            </div>

            <!-- Cart Trigger -->
            <div class="flex items-center gap-4">
                <button onclick="toggleCart()" class="relative p-2 text-gray-600 hover:text-blue-600 transition">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-12 px-4 mb-8">
        <div class="max-w-7xl mx-auto text-center md:text-left flex flex-col md:flex-row items-center justify-between gap-8">
            <div class="space-y-4 max-w-xl">
                <span class="bg-blue-500/30 text-blue-100 text-xs px-3 py-1 rounded-full uppercase tracking-wider font-semibold">Ưu đãi công nghệ 2026</span>
                <h1 class="text-3xl sm:text-5xl font-extrabold leading-tight">Công Nghệ Đỉnh Cao, Giá Cả Hợp Lý</h1>
                <p class="text-blue-100 text-sm sm:text-base">Sở hữu những thiết bị công nghệ mới nhất với mức giá ưu đãi và dịch vụ giao hàng siêu tốc.</p>
                <a href="#products" class="inline-block bg-white text-blue-600 font-bold px-6 py-3 rounded-full shadow-lg hover:bg-gray-100 transition">Khám Phá Ngay</a>
            </div>
            <div class="text-8xl text-blue-200/40 hidden md:block">
                <i class="fa-solid fa-laptop-code"></i>
            </div>
        </div>
    </section>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex-grow w-full pb-16" id="products">
        <!-- Filter Tabs -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <h2 class="text-2xl font-bold text-gray-900">Sản Phẩm Nổi Bật</h2>
            <div class="flex gap-2 overflow-x-auto pb-2 sm:pb-0" id="categoryButtons">
                <!-- Dynamically rendered categories -->
            </div>
        </div>

        <!-- Product Cards Grid -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamically rendered products -->
        </div>
    </main>

    <!-- Cart Drawer -->
    <div id="cartModal" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-sm transition-opacity">
        <div class="fixed inset-y-0 right-0 max-w-md w-full bg-white shadow-2xl flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping text-blue-600"></i> Giỏ Hàng Của Bạn
                </h3>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>
            
            <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Cart items list -->
            </div>

            <div class="p-4 border-t bg-gray-50 space-y-3">
                <div class="flex justify-between text-base font-bold text-gray-900">
                    <span>Tổng tiền thanh toán:</span>
                    <span id="cartTotal" class="text-blue-
